<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f2ee">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Пянсешка"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="./pyanse_icon_192.png"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Пянсешка</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f5f2ee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      text-align: center;
      padding: 30px;
    }

    img {
      width: 180px;
      height: 180px;
      border-radius: 36px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 10px;
    }

    p {
      color: #777;
      font-size: 16px;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 15px 25px;
      border-radius: 13px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="app">

    <img
      src="./apple-touch-icon.png"
      alt="Пянсешка"
    >

    <h1>Пянсешка</h1>

    <p>Система ревизий</p>

    <a
      href="https://script.google.com/macros/s/AKfycbzMi9OtrEJZU7Uw1SxjLpPYdI664MANvYbwcFLZAMXzdOLmiJloMQxT1KR6Wl35-7Rp/exec"
