<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f2ee">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Пянсешка"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="./pyanse_icon_192.png"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Пянсешка</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f5f2ee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #222;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .app {
      padding: 30px;
    }

    img {
      width: 180px;
      height: 180px;
      border-radius: 36px;
      display: block;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    p {
      margin-top: 8px;
      color: #777;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="app">

    <img
      src="./apple-touch-icon.png"
      alt="Пянсешка"
    >

    <h1>Пянсешка</h1>

    <p>Система ревизий</p>

  </div>

</body>
</html>
